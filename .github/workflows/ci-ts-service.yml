name: ci-ts-service

on:
  pull_request:
    paths: ["consumers/node-service/**", ".github/workflows/ci-ts-service.yml", ".github/workflows/reusable-ts-ci.yml", ".github/workflows/reusable-release.yml", ".github/actions/**"]
  push:
    branches: ["master"]
    tags: ["node-service-v*"]
    paths: [ "consumers/node-service/**", ".github/workflows/ci-ts-service.yml", ".github/workflows/reusable-ts-ci.yml", ".github/workflows/reusable-release.yml", ".github/actions/**"]

jobs:
  call_pr:
    if: github.event_name == 'pull_request'
    permissions: {contents: read}
    uses: "./.github/workflows/reusable-ts-ci.yml"
    with:
      service_path: consumers/node-service
      image_name: node-service
      platforms: linux/amd64
  
  ci_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions: {contents: read}
    uses: "./.github/workflows/reusable-ts-ci.yml"
    with:
      service_path: consumers/node-service
      image_name: node-service
      platforms: linux/amd64
  
  release_meta:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-service-v')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: extract_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/node-service-}" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
  
  ci_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-service-v')
    permissions: {contents: read}
    uses: "./.github/workflows/reusable-ts-ci.yml"
    with:
      service_path: consumers/node-service
      image_name: node-service
      platforms: linux/amd64
  
  release_push:
    needs: [release_meta, ci_release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-service-v')
    permissions: {contents: read, packages: write, id-token: write}
    uses: "./.github/workflows/reusable-release.yml"
    with:
      service_path: consumers/node-service
      image_name: node-service
      platforms: linux/amd64,linux/arm64
      tag: ${{ needs.release_meta.outputs.version }}
