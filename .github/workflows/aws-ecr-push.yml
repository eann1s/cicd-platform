name: aws-ecr-push

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  push:
    permissions: {contents: read, id-token: write}
    uses: "./.github/workflows/reusable-aws-ecr-push.yml"
    with:
      service_path: consumers/go-service
      image_uri: 980481493011.dkr.ecr.eu-north-1.amazonaws.com/cicd-platform-dev-go-service
      role_arn: "arn:aws:iam::980481493011:role/cicd-platform-dev-github-actions-ecr-push"
      region: eu-north-1
      platforms: linux/amd64


