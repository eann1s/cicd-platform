name: reusable-aws-ecr-push

on:
  workflow_call:
    inputs:
      service_path: { required: true, type: string }
      image_uri: { required: true, type: string }
      role_arn: { required: true, type: string }
      region: { required: true, type: string }
      platforms: { required: true, type: string }

jobs:
  push_image:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
      - name: Configure AWS creds with OIDC
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.region }}
      
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419

      - name: Build and push
        id: build-image
        uses: ./.github/actions/build-candidate
        with:
          platforms: ${{ inputs.platforms }}
          images: ${{ inputs.image_uri }}
          context: ${{ inputs.service_path }}
          dockerfile_path: ${{ inputs.service_path }}/Dockerfile
          publish: true
          tags: ${{ inputs.image_uri }}:${{ github.sha }}
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
