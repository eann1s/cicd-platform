apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: consumer-services-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: consumer-services.rules
      rules:
        - alert: ConsumerServiceTargetDown
          expr: up{job=~"go-service|node-service"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Consumer service target is down"
            description: "{{ $labels.job }} target {{ $labels.instance }} is down."

        - alert: ConsumerDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace=~"go-service|node-service"} < kube_deployment_spec_replicas{namespace=~"go-service|node-service"}
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Consumer services are unavailable"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired."

        - alert: ConsumerDeploymentRolloutStuck
          expr: kube_deployment_status_replicas_updated{namespace=~"go-service|node-service"} < kube_deployment_spec_replicas{namespace=~"go-service|node-service"}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Consumer services deployment rollout is stuck"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has not completed rollout for more than 5 minutes."
