apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: node-service
  
  namespaceSelector:
    matchNames:
      - node-service
  
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
