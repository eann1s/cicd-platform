apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: go-service
    
  namespaceSelector:
    matchNames:
      - go-service
    
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
