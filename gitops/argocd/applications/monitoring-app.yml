apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-app
  namespace: argocd
spec:
  project: platform

  source:
    repoURL: https://github.com/eann1s/cicd-platform.git
    targetRevision: master
    path: gitops/monitoring/grafana-dashboards
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
