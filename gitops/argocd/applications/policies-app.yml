apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies-app
  namespace: argocd
spec:
  project: platform

  source:
    repoURL: https://github.com/eann1s/cicd-platform.git
    targetRevision: master
    path: gitops/policies/kyverno

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
